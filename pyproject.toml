[project]
name = "csda-client"
version = "0.1.0"
description = "API client for CSDA services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "stapi-pydantic>=0.1.0",
    "pystac>=1.14.3",
]

[project.urls]
repository = "https://github.com/NASA-IMPACT/csda-client"

[dependency-groups]
dev = ["mypy>=2.1.0", "pytest>=9.1.1", "ruff>=0.15.18", "pytest-dotenv>=0.5.2"]
docs = [
    "contextily>=1.7.0",
    "geopandas>=1.1.3",
    "ipykernel>=7.3.0",
    "pystac-client>=0.8.6",
    "humanize>=4.15.0",
    "tabulate>=0.10.0",
    "cql2>=0.5.6",
    "jinja2>=3.1.6",
    "basemap>=2.0.0",
    "rasterio>=1.5.0",
    "contextily>=1.7.0",
    "json-schema-for-humans>=1.5.1",
    "mike>=2.2.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-jupyter>=0.25.1",
    "mkdocstrings[python]>=1.0.4",
]
notebook = [
    "jupyterlab>=4.6.2",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.mypy]
files = "src/**/*.py,tests/**/*.py"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
