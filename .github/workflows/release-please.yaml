name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.release-please.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.CSDA_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CSDA_RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          token: ${{ steps.generate-token.outputs.token }}
          release-type: python
  update-lockfile:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.CSDA_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CSDA_RELEASE_BOT_PRIVATE_KEY }}
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ fromJSON(needs.release-please.outputs.prs)[0].headBranchName }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync uv
        run: uv sync
      - name: Commit and push changes
        run: |
          git config user.name "csda-release-app[bot]"
          git config user.email "csda-release-app[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update uv.lock"
          git push
